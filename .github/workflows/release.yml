name: Release handling

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  generate-release:
    name: "Generate release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: "Validate release tag"
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG_NAME" =~ $semver_regex ]]; then
            echo "Tag '$TAG_NAME' is not a valid version tag (expected vMAJOR.MINOR.PATCH with optional SemVer prerelease/build metadata)." >&2
            exit 1
          fi
      - name: "Build release package"
        run: |
          zip -r Office365-Scoutnet-synk.zip Office365-Scoutnet-synk

      - name: Install needed modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Microsoft.Graph.Authentication -RequiredVersion 2.41.2 -Force -ErrorAction Stop
            Install-Module Microsoft.Graph.Users -RequiredVersion 2.41.2 -Force -ErrorAction Stop
            Install-Module Microsoft.Graph.Users.Actions -RequiredVersion 2.41.2 -Force -ErrorAction Stop
            Install-Module Microsoft.Graph.Groups -RequiredVersion 2.41.2 -Force -ErrorAction Stop
            Install-Module Microsoft.Graph.Teams -RequiredVersion 2.41.2 -Force -ErrorAction Stop
            Install-Module Microsoft.Graph.Identity.DirectoryManagement -RequiredVersion 2.41.2 -Force -ErrorAction Stop
            Install-Module ExchangeOnlineManagement -RequiredVersion 3.10.1 -Force -ErrorAction Stop

      - name: Test-ModuleManifest
        shell: pwsh
        run: |
          Test-ModuleManifest Office365-Scoutnet-synk/Office365-Scoutnet-synk.psd1 -ErrorAction Stop

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            LICENSE
            MaillistSynk.ps1
            MaillistSynk_local.ps1
            Office365-Scoutnet-synk.zip

      - name: "Build PowerShell Gallery package"
        id: module-package
        shell: pwsh
        run: |
          $packagePath = ./tools/New-ModulePackage.ps1 -ModulePath ./Office365-Scoutnet-synk -DestinationPath $env:RUNNER_TEMP
          "path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: "Publish to PowerShell Gallery"
        env:
          PS_GALLERY_KEY: ${{ secrets.PS_GALLERY_KEY }}
          PACKAGE_PATH: ${{ steps.module-package.outputs.path }}
        shell: pwsh
        run: |
          Write-Host -Object 'Publishing module (Office365-Scoutnet-synk) to PowerShell Gallery'
          Publish-PSResource -NupkgPath $env:PACKAGE_PATH -ApiKey $env:PS_GALLERY_KEY -Repository PSGallery -ErrorAction Stop
          Write-Host -Object 'Finished publishing module to PowerShell Gallery'

  publish-pages:
    name: "Publish documentation"
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
